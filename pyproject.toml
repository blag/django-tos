[build-system]
requires = ["setuptools>=61.2"]
build-backend = "setuptools.build_meta"

[project]
name = "django-tos"
version = "1.1.0"
authors = [{name = "Frank Wiles", email = "frank@revsys.com"}]
description = "django-tos is a reusable Django application for setting Terms of Service."
readme = "README.rst"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Framework :: Django",
]

[project.urls]
Homepage = "http://github.com/revsys/django-tos/tree/master"
PyPI = "https://pypi.org/project/django-tos/"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages]
find = {namespaces = false}

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "test_app.settings"
addopts = """
--verbose
--cov-branch
--cov=.
--no-cov-on-fail
--cov-report=term
--cov-report=html
"""
pythonpath = [
    ".",
]
